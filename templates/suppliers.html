<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Select Preferred Supplier</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      #go-dashboard {
        margin-top: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Select Preferred Supplier</h2>

    <label for="region-filter">Filter by Region:</label>
    <select id="region-filter">
      <option value="">All Regions</option>
    </select>

    <table id="suppliers-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Region</th>
          <th>Contact</th>
          <th>Select</th>
        </tr>
      </thead>
      <tbody id="supplier-body"></tbody>
    </table>

    <button id="go-dashboard">Go to Dashboard</button>

    <script>
      async function loadSuppliers() {
        const res = await fetch("/api/suppliers", { credentials: "include" });
        const suppliers = await res.json();

        populateRegionFilter(suppliers);
        renderTable(suppliers);

        document
          .getElementById("region-filter")
          .addEventListener("change", () => {
            const selected = document.getElementById("region-filter").value;
            const filtered = suppliers.filter(
              (s) => !selected || s.region === selected
            );
            renderTable(filtered);
          });
      }

      function populateRegionFilter(suppliers) {
        const regionFilter = document.getElementById("region-filter");
        const regions = [...new Set(suppliers.map((s) => s.region))].sort();
        for (const region of regions) {
          const opt = document.createElement("option");
          opt.value = region;
          opt.textContent = region;
          regionFilter.appendChild(opt);
        }
      }

      function renderTable(suppliers) {
        const body = document.getElementById("supplier-body");
        body.innerHTML = "";
        suppliers.forEach((s) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${s.name}</td>
            <td>${s.region}</td>
            <td>${s.contact || ""}</td>
            <td>
              <button onclick='selectSupplier(${JSON.stringify(
                JSON.stringify(s)
              )})'>Select</button>
            </td>
          `;
          body.appendChild(row);
        });
      }

      function selectSupplier(json) {
        const supplier = JSON.parse(json);
        localStorage.setItem("preferred_supplier", JSON.stringify(supplier));
        alert(
          `✅ Preferred supplier set to: ${supplier.name} (${supplier.region})`
        );
        document.getElementById("go-dashboard").style.display = "inline-block";
      }

      document.getElementById("go-dashboard").addEventListener("click", () => {
        window.location.href = "/dashboard";
      });

      loadSuppliers();
    </script>
  </body>
</html>
