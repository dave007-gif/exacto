<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Data CSV</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/favicon.ico') }}" type="image/x-icon" />
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='core.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin-upload.css') }}" />

    <!-- Mount-aware shim -->
    <script>
      // Simplified mount-aware script for root deployment
      (function () {
        // No need to detect BASE or API_BASE - we're at the root
        window.API_BASE = "";

        // Simplified URL normalization that just ensures leading slash
        const toAbs = (url) => {
          if (typeof url !== "string") return url;
          if (url.startsWith("/")) return url;
          return "/" + url.replace(/^\.?\/+/, "");
        };

        // Keep the redirect patching for relative URLs
        const assignOrig = window.location.assign.bind(window.location);
        const replaceOrig = window.location.replace.bind(window.location);
        window.location.assign = (url) => assignOrig(toAbs(String(url)));
        window.location.replace = (url) => replaceOrig(toAbs(String(url)));

        // No need to rewrite anchors/forms since we're at root
      })();
    </script>
  </head>
  <body>
    <header
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      "
    >
      <h2>Upload Admin Data (CSV)</h2>
      <nav>
        <a href="{{ url_for('main.dashboard') }}">🏠 Go to Dashboard</a> |
        <a href="{{ url_for('admin_uploader_requests_page') }}"
          >👤 Uploader Requests</a
        >
        |
        <a href="{{ url_for('logout') }}">🚪 Logout</a>
      </nav>
    </header>

    <p style="color: #444">
      Note: when <code>ADMIN_AUTO_APPLY = false</code>, uploads from non-admin
      accounts are staged for admin review... Admins may apply immediately.
      After uploading you'll see a Staging ID. Admins can review at
      <a href="/admin_review">Staged Uploads</a>.
    </p>

    <form id="upload-form">
      <label for="upload-category">Select Category:</label><br />
      <select name="category" id="upload-category" required>
        <option value="materials">Materials</option>
        <option value="labor">Labor</option>
        <option value="plants">Plants</option>
        <option value="adjustments">Adjustments</option>
        <option value="sources">Sources</option>
        <option value="locations">Locations</option>
        <option value="haulage_bands">Haulage Bands</option>
      </select>

      <br /><br />

      <label for="csvFile">Select CSV file:</label><br />
      <input type="file" id="csvFile" accept=".csv" required />

      <br /><br />

      <button type="submit">Upload</button>
    </form>

    <div id="upload-result"></div>

    <script>
      document
        .getElementById("upload-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const category = document.getElementById("upload-category").value;
          const fileInput = document.getElementById("csvFile");
          const resultDiv = document.getElementById("upload-result");
          resultDiv.innerHTML = ""; // Clear previous

          if (!category || fileInput.files.length === 0) {
            resultDiv.innerText = "❗ Please select a category and CSV file.";
            return;
          }

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          try {
            const response = await fetch(`/api/upload-prices/${category}`, {
              method: "POST",
              body: formData,
              credentials: "include",
            });

            let result;
            try {
              result = await response.json();
            } catch (err) {
              resultDiv.innerHTML = `❌ Server returned an invalid response.`;
              return;
            }

            if (response.ok) {
              const errors = result.errors || [];
              let html = `
                ✅ <strong>${result.message}</strong><br>
                ✔️ Inserted: ${result.inserted}<br>
                ⚠️ Skipped: ${result.skipped}<br>
                🗂️ Category: ${result.category}<br>
              `;

              if (errors.length > 0) {
                html += `
                  <details>
                    <summary>🔍 View ${
                      errors.length
                    } skipped rows with issues</summary>
                    <ul>
                      ${errors.map((e) => `<li>${e}</li>`).join("")}
                    </ul>
                  </details>
                `;
              }

              resultDiv.innerHTML = html;
            } else {
              resultDiv.innerHTML = `❌ Upload failed: ${
                result.message || response.statusText
              }`;
            }
          } catch (err) {
            console.error("Upload failed:", err);
            resultDiv.innerText = `❌ Upload failed: ${err.message}`;
          }
        });
    </script>
  </body>
</html>
