<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Data CSV</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: auto;
        padding: 2rem;
      }

      h2 {
        color: #333;
      }

      #upload-result {
        margin-top: 1rem;
        border-top: 1px solid #ccc;
        padding-top: 1rem;
        font-size: 0.95rem;
      }

      #upload-result details summary {
        cursor: pointer;
        font-weight: bold;
        margin-top: 0.5rem;
      }

      #upload-result ul {
        padding-left: 1.5rem;
      }

      #upload-result li {
        color: crimson;
        margin-bottom: 0.3rem;
      }

      label {
        font-weight: bold;
      }

      select,
      input[type="file"],
      button {
        margin-top: 0.3rem;
      }
    </style>
  </head>
  <body>
    <header
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      "
    >
      <h2>Upload Admin Data (CSV)</h2>
      <nav>
        <a href="/dashboard">🏠 Go to Dashboard</a> |
        <a href="/admin/uploader/requests-ui">👤 Uploader Requests</a> |
        <a href="/logout">🚪 Logout</a>
      </nav>
    </header>

    <p style="color: #444">
      Note: when <code>ADMIN_AUTO_APPLY = false</code>, uploads from non-admin
      accounts are staged for admin review... Admins may apply immediately.
      After uploading you'll see a Staging ID. Admins can review at
      <a href="/admin_review">Staged Uploads</a>.
    </p>

    <form id="upload-form">
      <label for="upload-category">Select Category:</label><br />
      <select name="category" id="upload-category" required>
        <option value="materials">Materials</option>
        <option value="labor">Labor</option>
        <option value="plants">Plants</option>
        <option value="adjustments">Adjustments</option>
        <option value="sources">Sources</option>
        <option value="locations">Locations</option>
        <option value="haulage_bands">Haulage Bands</option>
      </select>

      <br /><br />

      <label for="csvFile">Select CSV file:</label><br />
      <input type="file" id="csvFile" accept=".csv" required />

      <br /><br />

      <button type="submit">Upload</button>
    </form>

    <div id="upload-result"></div>

    <script>
      document
        .getElementById("upload-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const category = document.getElementById("upload-category").value;
          const fileInput = document.getElementById("csvFile");
          const resultDiv = document.getElementById("upload-result");
          resultDiv.innerHTML = ""; // Clear previous

          if (!category || fileInput.files.length === 0) {
            resultDiv.innerText = "❗ Please select a category and CSV file.";
            return;
          }

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          try {
            const response = await fetch(`/api/upload-prices/${category}`, {
              method: "POST",
              body: formData,
              credentials: "include",
            });

            let result;
            try {
              result = await response.json();
            } catch (err) {
              resultDiv.innerHTML = `❌ Server returned an invalid response.`;
              return;
            }

            if (response.ok) {
              const errors = result.errors || [];
              let html = `
                ✅ <strong>${result.message}</strong><br>
                ✔️ Inserted: ${result.inserted}<br>
                ⚠️ Skipped: ${result.skipped}<br>
                🗂️ Category: ${result.category}<br>
              `;

              if (errors.length > 0) {
                html += `
                  <details>
                    <summary>🔍 View ${
                      errors.length
                    } skipped rows with issues</summary>
                    <ul>
                      ${errors.map((e) => `<li>${e}</li>`).join("")}
                    </ul>
                  </details>
                `;
              }

              resultDiv.innerHTML = html;
            } else {
              resultDiv.innerHTML = `❌ Upload failed: ${
                result.message || response.statusText
              }`;
            }
          } catch (err) {
            console.error("Upload failed:", err);
            resultDiv.innerText = `❌ Upload failed: ${err.message}`;
          }
        });
    </script>
  </body>
</html>
