<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Prices csvFile</title>
  </head>
  <body>
    <!-- admin_upload.html -->
    <h2>Upload Price Data (Admin Only)</h2>

    <form id="upload-form">
      <label for="category">Select Category:</label>
      <select id="category" required>
        <option value="">--Choose--</option>
        <option value="materials">Materials</option>
        <option value="labor">Labor</option>
        <option value="plants">Plants</option>
      </select>

      <br /><br />

      <label for="csvFile">Select CSV file:</label>
      <input type="file" id="csvFile" accept=".csv" required />

      <br /><br />

      <button type="submit">Upload</button>
    </form>

    <div id="upload-result"></div>
    <script>
      document
        .getElementById("upload-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const category = document.getElementById("category").value;
          const fileInput = document.getElementById("csvFile");
          const resultDiv = document.getElementById("upload-result");
          resultDiv.innerText = ""; // ✅ Clear old message

          if (!category || fileInput.files.length === 0) {
            resultDiv.innerText = "Please select a category and CSV file.";
            return;
          }

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          try {
            const response = await fetch(`/api/upload-prices/${category}`, {
              method: "POST",
              body: formData,
              credentials: "include",
            });

            const result = await response.json();

            if (response.ok) {
              resultDiv.innerHTML = `
            ✅ <strong>${result.message}</strong><br>
            ✔️ Inserted: ${result.inserted}<br>
            ⚠️ Skipped: ${result.skipped}<br>
            🗂️ Category: ${result.category}
            `;
            } else {
              resultDiv.innerText = `❌ Error: ${
                result.message || response.statusText
              }`;
            }
          } catch (err) {
            console.error("Upload failed:", err);
            resultDiv.innerText = `❌ Upload failed: ${err.message}`;
          }
        });
    </script>
  </body>
</html>
