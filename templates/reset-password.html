<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/favicon.ico') }}" type="image/x-icon" />
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='core.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='forms.css') }}"
    />
  </head>
  <body>
    <nav id="nav" class="navbar-bg navbar-transparent">
      <div class="logo">EXACTO</div>
      <div class="menu">
        <ul class="menu-links" id="menu-links">
          <li><a href="{{ url_for('main.index') }}">Home</a></li>
          <li><a href="{{ url_for('main.about') }}">About</a></li>
          <li><a href="{{ url_for('main.contact') }}">Contact</a></li>
          <li><a href="{{ url_for('main.estimate') }}">Estimate</a></li>
          <li><a href="{{ url_for('main.projects') }}">Projects</a></li>
        </ul>
      </div>
    </nav>
    <h1>Reset Password</h1>
    <form id="reset-password-form">
      <input type="hidden" id="token" value="{{ token }}" />
      <p>
        <label for="password">New Password:</label>
        <input type="password" id="password" name="password" required />
      </p>
      <div style="display: flex; gap: 10px; align-items: center">
        <button type="button" id="submit-reset">Reset Password</button>
        <a href="/login" class="calculate-btn" style="text-decoration: none"
          >Back to Login</a
        >
      </div>
    </form>

    <section>
      <h3>Didn't get your reset link?</h3>
      <input type="email" id="resend-reset-email" placeholder="Your email" />
      <button type="button" id="resend-reset-btn">Resend Reset Link</button>
    </section>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  </body>
</html>
